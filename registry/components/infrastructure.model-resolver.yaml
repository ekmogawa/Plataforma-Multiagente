id: infrastructure.model-resolver
name: Model Resolver
layer: infrastructure
kind: adapter
status: active
purpose_ptbr: "Resolve um modelo do catálogo para o adaptador do provedor e executa, aplicando a cadeia de fallback em erros retriáveis."
